kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: metrics-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-app   # 扩缩容的目标
  minReplicas: 2        # 和默认部署时相同
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second   # kubernetes中的指标名，不是Prometheus的指标名
        target:
          type: AverageValue
          averageValue: 3   # http_requests_per_second的AverageValue平均值大于等于3时，会触发扩容
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 10   # 触发缩容条件后，缩容前的等待时间
