# 1. 定义 BGP 对等体（连接至你的物理路由器）
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: local-bgp-peer
  namespace: metallb-system
spec:
  peerAddress: 192.168.1.1        # 【请替换】你的 BGP 路由器 IP 地址
  peerASN: 65001                  # 【请替换】你的路由器 AS 号
  myASN: 65000                    # 【请替换】你为 MetalLB 分配的 AS 号
  # 可选：只允许特定节点与这个 BGP Peer 建立连接
  nodeSelectors:
  - matchExpressions:
    - key: kubernetes.io/hostname
      operator: In
      values:
      - node1
      - node2
---
# 2. 定义 IP 地址池（使用你已有的配置，或复用 localip-pool）
# 如果你的 localip-pool 已经存在，可以跳过此 YAML 部分。
# 如果没有，你需要取消下面的注释并填写正确的 IP 范围。
# apiVersion: metallb.io/v1beta1
# kind: IPAddressPool
# metadata:
#   name: localip-pool
#   namespace: metallb-system
# spec:
#   addresses:
#   - 192.168.1.240-192.168.1.250  # 替换为你的 IP 范围
#   autoAssign: true
---
# 3. 定义 BGP 广告，将池子与对等体关联
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: local-bgp-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - localip-pool                   # 使用你已有的 IP 地址池
  peers:
  - local-bgp-peer                 # 与上面的 BGPPeer 名称一致
  aggregationLength: 32            # 将 IP 作为 /32 主机路由宣告，便于故障转移